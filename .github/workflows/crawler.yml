name: Get Hot News

on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

# 1. 必须增加 pages 和 id-token 的写权限
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # (此处保留你原有的 Check Expiration, Delay, Setup Python, Install 等步骤)
      # ... [保持不变] ...

      - name: Run crawler
        # ... [保持原有 env 配置] ...
        run: python -m trendradar

      # 2. 核心步骤：将生成的网页文件上传为 Artifact
      # 假设你的网页文件（index.html等）生成在根目录 '.'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

  # 3. 新增部署任务：将 Artifact 发布到 GitHub Pages 服务器
  deploy:
    needs: crawl
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
